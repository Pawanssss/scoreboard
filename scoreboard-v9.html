<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billabong High International School, Jabalpur - Annual Sports Day Scoreboard</title>
  <style>
    :root {
      --bg-dark: #1E1136;
      --bg-card: #2B1B47;
      --school-purple: #573B87;
      --school-yellow: #F8C21C;
      --school-taupe: #B9AA8E;
      --border-color: #462D73;
      --text-light: #FFFFFF;
      --text-muted: #D8CEE8;
      
      --freedom: #EF4444;
      --unity: #3B82F6;
      --equality: #22C55E;
      --peace: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Frozen Top Section (72% height in normal mode) */
    .frozen-top {
      height: 72vh;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 20px;
      background: linear-gradient(180deg, #241440 0%, var(--bg-dark) 100%);
      border-bottom: 3px solid var(--school-yellow);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      z-index: 10;
      transition: height 0.25s ease;
    }

    /* Fullscreen Presentation Mode */
    body.presentation-mode .frozen-top {
      height: 100vh;
      border-bottom: none;
      padding: 20px 32px;
    }

    body.presentation-mode .scrollable-bottom,
    body.presentation-mode .controls-bar,
    body.presentation-mode .initial-box,
    body.presentation-mode .logo-upload-btn {
      display: none !important;
    }

    /* White School Header Card */
    .school-header {
      background: #FFFFFF;
      color: var(--school-purple);
      border-radius: 14px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 5px solid var(--school-yellow);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    body.presentation-mode .school-header {
      padding: 16px 28px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .logo-box {
      width: 82px;
      height: 82px;
      border-radius: 10px;
      border: 2px dashed var(--school-taupe);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      background: #FAF8F5;
      transition: border-color 0.2s;
    }

    body.presentation-mode .logo-box {
      width: 105px;
      height: 105px;
      border-style: solid;
      border-color: transparent;
    }

    .logo-box:hover {
      border-color: var(--school-purple);
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-placeholder {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--school-purple);
      padding: 4px;
      line-height: 1.2;
    }

    .logo-upload-btn {
      font-size: 0.7rem;
      background: var(--school-purple);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 7px;
      cursor: pointer;
      font-weight: 600;
    }

    .school-titles h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--school-purple);
      line-height: 1.5;
    }

    body.presentation-mode .school-titles h1 {
      font-size: 2.1rem;
    }

    .school-titles .sub-school {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--school-taupe);
      margin-top: 2px;
    }

    body.presentation-mode .school-titles .sub-school {
      font-size: 1.15rem;
    }

    .school-titles .event-banner {
      display: inline-block;
      margin-top: 6px;
      background: var(--school-yellow);
      color: #1E1136;
      font-weight: 800;
      font-size: 1rem;
      padding: 3px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    body.presentation-mode .school-titles .event-banner {
      font-size: 1.05rem;
      padding: 5px 16px;
    }

    .header-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .header-btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .fs-toggle-btn {
      background: var(--school-purple);
      color: var(--school-yellow);
      border: 2px solid var(--school-yellow);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(87, 59, 135, 0.35);
      transition: transform 0.15s, background 0.15s;
    }

    .fs-toggle-btn:hover {
      background: #432B6B;
      transform: translateY(-1px);
    }

    .celebrate-btn {
      background: var(--school-yellow);
      color: #1E1136;
      border: 2px solid var(--school-purple);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(248, 194, 28, 0.4);
      transition: transform 0.15s, background 0.15s;
    }

    .celebrate-btn:hover {
      background: #ffe066;
      transform: translateY(-1px);
    }

    .points-legend {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--school-purple);
      background: #F4F0FA;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #DFD4F2;
    }

    /* Standings Cards Grid */
    .standings-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      flex: 1;
      margin: 12px 0;
      min-height: 0;
    }

    body.presentation-mode .standings-grid {
      gap: 24px;
      margin: 22px 0 10px 0;
    }

    .house-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 14px 16px;
      border-top: 8px solid #fff;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .house-card.leader {
      box-shadow: 0 0 24px rgba(248, 194, 28, 0.45);
      border-left: 2px solid var(--school-yellow);
      border-right: 2px solid var(--school-yellow);
      border-bottom: 2px solid var(--school-yellow);
    }

    .house-card.freedom { border-top-color: var(--freedom); }
    .house-card.unity { border-top-color: var(--unity); }
    .house-card.equality { border-top-color: var(--equality); }
    .house-card.peace { border-top-color: var(--peace); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .house-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .freedom .color-dot { background: var(--freedom); }
    .unity .color-dot { background: var(--unity); }
    .equality .color-dot { background: var(--equality); }
    .peace .color-dot { background: var(--peace); border: 1px solid #888; }

    .house-name {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    body.presentation-mode .house-name {
      font-size: 2rem;
    }

    .rank-badge {
      background: var(--school-purple);
      color: var(--text-light);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .house-card.leader .rank-badge {
      background: var(--school-yellow);
      color: #1E1136;
    }

    body.presentation-mode .rank-badge {
      font-size: 1.15rem;
      padding: 6px 14px;
    }

    .score-display {
      text-align: center;
      margin: auto 0;
    }

    .total-score {
      font-size: 4.2rem;
      font-weight: 900;
      line-height: 1;
      color: var(--text-light);
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    }

    .house-card.leader .total-score {
      color: var(--school-yellow);
    }

    body.presentation-mode .total-score {
      font-size: 7.5rem;
    }

    .score-sub {
      font-size: 0.78rem;
      color: var(--school-taupe);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    body.presentation-mode .score-sub {
      font-size: 1.1rem;
      margin-top: 10px;
    }

    .initial-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .initial-box input {
      width: 68px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--school-taupe);
      background: var(--bg-dark);
      color: var(--school-yellow);
      font-size: 0.92rem;
      font-weight: 800;
      text-align: center;
    }

    /* Controls Bar inside Frozen Section */
    .controls-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .controls-bar input[type="text"] {
      flex: 1;
      padding: 7px 12px;
      border-radius: 7px;
      border: 1px solid var(--school-taupe);
      background: var(--bg-dark);
      color: #fff;
      font-size: 0.9rem;
    }

    .controls-bar input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 7px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-export {
      background: var(--school-yellow);
      color: #1E1136;
    }

    .btn-reset {
      background: #DC2626;
      color: #FFFFFF;
    }

    /* Bottom Scrollable Events Section (28% height) */
    .scrollable-bottom {
      flex: 1;
      overflow-y: auto;
      padding: 14px 20px 28px 20px;
      background: var(--bg-dark);
    }

    .events-list {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .event-card {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
    }

    .event-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--school-yellow);
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    .house-rows {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 8px;
    }

    .house-score-row {
      background: var(--bg-dark);
      padding: 7px 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid transparent;
    }

    .house-score-row.freedom { border-left-color: var(--freedom); }
    .house-score-row.unity { border-left-color: var(--unity); }
    .house-score-row.equality { border-left-color: var(--equality); }
    .house-score-row.peace { border-left-color: var(--peace); }

    .house-label {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .point-buttons {
      display: flex;
      gap: 4px;
    }

    .pt-btn {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-light);
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.12s;
    }

    .pt-btn:hover {
      background: var(--school-purple);
    }

    .pt-btn.active {
      background: var(--school-yellow);
      color: #1E1136;
      border-color: var(--school-yellow);
    }

    .pt-btn.active-zero {
      background: var(--school-taupe);
      color: #1E1136;
      border-color: var(--school-taupe);
    }

    /* Winner Announcement Toast */
    .winner-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, var(--school-purple), #3B2266);
      color: #FFFFFF;
      border: 3px solid var(--school-yellow);
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1.25rem;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 10000;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    .winner-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .winner-toast span {
      color: var(--school-yellow);
    }

    @media (max-width: 900px) {
      .frozen-top {
        height: 68vh;
        min-height: 380px;
        padding: 8px 12px;
      }
      .standings-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .total-score {
        font-size: 2.8rem;
      }
      body.presentation-mode .total-score {
        font-size: 4.5rem;
      }
      .school-titles h1 {
        font-size: 1.15rem;
      }
      .logo-box {
        width: 58px;
        height: 58px;
      }
      .winner-toast {
        font-size: 1rem;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>

  <canvas id="confettiCanvas"></canvas>
  <div id="winnerToast" class="winner-toast"></div>

  <!-- Frozen Top Main Screen -->
  <div class="frozen-top">
    <header class="school-header">
      <div class="brand-left">
        <div class="logo-wrapper">
          <div class="logo-box" onclick="document.getElementById('logoInput').click()" title="Click to select school logo">
            <img id="schoolLogoImg" src="logo.png" alt="School Logo" style="display:none;" onload="this.style.display='block'; document.getElementById('logoPlaceholder').style.display='none';" onerror="this.style.display='none';" />
            <div id="logoPlaceholder" class="logo-placeholder">Click to<br/>Load Logo</div>
          </div>
          <button class="logo-upload-btn" onclick="document.getElementById('logoInput').click()"></button>
          <input type="file" id="logoInput" accept="image/*" style="display:none;" onchange="handleLogoUpload(event)" />
        </div>
        <div class="school-titles">
          <h1>BILLABONG HIGH INTERNATIONAL SCHOOL, JABALPUR</h1>
          <div class="event-banner">🏆 ANNUAL SPORTS FIESTA – PRATIBIMB 2026, LIVE SCOREBOARD</div>
        </div>
      </div>

      <div class="header-actions">
        <div class="header-btn-row">
          <button class="celebrate-btn" onclick="triggerCelebration()">🎉 Celebrate Leader</button>
          <button id="fsToggleBtn" class="fs-toggle-btn" onclick="togglePresentationMode()">🖥️ Full-Screen Scoreboard</button>
        </div>
        <div class="points-legend">Points: 1st = 10 | 2nd = 8 | 3rd = 6 | 4th = 4 | None/DQ = 0</div>
      </div>
    </header>

    <!-- 4 Houses Live Standings -->
    <section class="standings-grid" id="standingsContainer"></section>

    <!-- Search & Action Controls -->
    <section class="controls-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search event by number or name (e.g., 100 MT, Skating, Relay)..." oninput="renderEvents()" />
      <div class="action-buttons">
        <button class="btn btn-export" onclick="exportCSV()">📥 Export CSV</button>
        <button class="btn btn-reset" onclick="resetAll()">🔄 Reset All</button>
      </div>
    </section>
  </div>

  <!-- Scrollable Events Entry Section -->
  <main class="scrollable-bottom">
    <div class="events-list" id="eventsContainer"></div>
  </main>

  <script>
    const HOUSES = new Array(
      { id: 'freedom', name: 'Freedom', color: 'Red', hex: '#EF4444' },
      { id: 'unity', name: 'Unity', color: 'Blue', hex: '#3B82F6' },
      { id: 'equality', name: 'Equality', color: 'Green', hex: '#22C55E' },
      { id: 'peace', name: 'Peace', color: 'White', hex: '#FFFFFF' }
    );

    const EVENTS = new Array(
      "1. 50 MT. FLAT RACE (BOYS)",
      "2. 50 MT. FLAT RACE (GIRLS)",
      "3. 50 MT. FLAT RACE (BOYS)",
      "4. 50 MT. FLAT RACE (GIRLS)",
      "5. 100 MT. (2x50) SHUTTLE RUN (BOYS)",
      "6. 100 MT. (2x50) SHUTTLE RUN (BOYS)",
      "7. 100 MT. HURDLES RACE (BOYS)",
      "8. 100 MT. HURDLES RACE (BOYS)",
      "9. 200MT. FLAT RACE (BOYS)",
      "10. 200MT. FLAT RACE (GIRLS)",
      "11. 400MT. FLAT RACE (BOYS)",
      "12. 400MT. FLAT RACE (GIRLS)",
      "13. 200MT. SKATING (BOYS)",
      "14. 200MT. SKATING (GIRLS)",
      "15. 400MT. SKATING (BOYS)",
      "16. 400MT. SKATING (GIRLS)",
      "17. 200MT. SEGWAY (BOYS)",
      "18. 200MT. SEGWAY (GIRLS)",
      "19. 200MT. SEGWAY (BOYS)",
      "20. 200MT. SEGWAY (GIRLS)",
      "21. 4X100 MT. MIXED RELAY (BOYS/GIRLS)",
      "22. 4X100 MT. MIXED RELAY (BOYS/GIRLS)",
      "23. 4X100 MT RELAY RACE (BOYS)",
      "24. 4X100 MT RELAY RACE (GIRLS)",
      "25. 200MT. HURDLES (BOYS)",
      "26. 200MT. HURDLES (GIRLS)"
    );

    const POINT_OPTIONS = new Array(10, 8, 6, 4, 0);
    const STORAGE_KEY = 'bhis_jabalpur_sports_scoreboard_v9';
    const LOGO_STORAGE_KEY = 'bhis_jabalpur_school_logo_data';

    let state = {
      initialScores: { freedom: 0, unity: 0, equality: 0, peace: 0 },
      eventScores: {}
    };

    /* ================= CONFETTI ENGINE ================= */
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = new Array();
    let confettiAnimId = null;
    let toastTimeout = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchConfetti(paletteColors, particleCount) {
      const count = particleCount || 180;
      const colors = paletteColors || new Array('#F8C21C', '#573B87', '#EF4444', '#3B82F6', '#22C55E', '#FFFFFF');

      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 11 + 6,
          h: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4.5,
          vy: Math.random() * 3.5 + 2.5,
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          opacity: 1,
          shape: Math.random() > 0.3 ? 'rect' : 'circle'
        });
      }

      if (!confettiAnimId) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.vRot;
        p.vy += 0.04; // subtle gravity

        if (p.y > canvas.height - 60) {
          p.opacity -= 0.025;
        }

        if (p.opacity <= 0 || p.y > canvas.height + 20) {
          confettiParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;

        if (p.shape === 'rect') {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      if (confettiParticles.length > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimId = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function showWinnerToast(messageHTML) {
      const toast = document.getElementById('winnerToast');
      toast.innerHTML = messageHTML;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() {
        toast.classList.remove('show');
      }, 4200);
    }

    function triggerCelebration() {
      const totals = calculateTotals();
      const sorted = HOUSES.slice().sort(function(a, b) {
        return totals[b.id] - totals[a.id];
      });

      const topScore = totals[sorted[0].id];
      const leaders = sorted.filter(function(h) {
        return totals[h.id] === topScore;
      });

      if (topScore === 0) {
        launchConfetti(new Array('#F8C21C', '#573B87', '#FFFFFF'), 140);
        showWinnerToast('🏆 Annual Sports Day <span>Celebration!</span>');
        return;
      }

      // Build confetti colors matching the leading house(s) + school gold & purple
      const celebrationColors = new Array('#F8C21C', '#573B87');
      leaders.forEach(function(h) {
        celebrationColors.push(h.hex);
        celebrationColors.push(h.hex);
      });

      launchConfetti(celebrationColors, 240);

      if (leaders.length === 1) {
        showWinnerToast('🏆 <span>' + leaders[0].name.toUpperCase() + ' HOUSE</span> LEADS WITH <span>' + topScore + ' PTS!</span> 🎉');
      } else {
        const names = leaders.map(function(h) { return h.name.toUpperCase(); }).join(' & ');
        showWinnerToast('🏆 TIE FOR 1ST: <span>' + names + '</span> WITH <span>' + topScore + ' PTS!</span> 🎉');
      }
    }

    /* ================= SCOREBOARD LOGIC ================= */
    function loadLogo() {
      const savedLogo = localStorage.getItem(LOGO_STORAGE_KEY);
      if (savedLogo) {
        const img = document.getElementById('schoolLogoImg');
        img.src = savedLogo;
        img.style.display = 'block';
        document.getElementById('logoPlaceholder').style.display = 'none';
      }
    }

    function handleLogoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        try {
          localStorage.setItem(LOGO_STORAGE_KEY, dataUrl);
        } catch (err) {
          console.warn("Logo image too large for localStorage, loaded for session only.");
        }
        const img = document.getElementById('schoolLogoImg');
        img.src = dataUrl;
        img.style.display = 'block';
        document.getElementById('logoPlaceholder').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function togglePresentationMode() {
      const isPresenting = document.body.classList.toggle('presentation-mode');
      const btn = document.getElementById('fsToggleBtn');
      if (isPresenting) {
        btn.textContent = '✏️ Exit Full-Screen (Edit Events)';
        triggerCelebration(); // Automatically launch confetti when entering Full-Screen mode!
      } else {
        btn.textContent = '🖥️ Full-Screen Scoreboard';
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.body.classList.contains('presentation-mode')) {
        togglePresentationMode();
      }
    });

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('bhis_jabalpur_sports_scoreboard_v8') || localStorage.getItem('bhis_jabalpur_sports_scoreboard_v7');
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          console.error("Failed to parse saved state", e);
        }
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function updateInitialScore(houseId, value) {
      const num = parseInt(value, 10);
      state.initialScores[houseId] = isNaN(num) ? 0 : num;
      saveState();
      renderStandings();
    }

    function setEventPoints(eventIdx, houseId, points) {
      if (!state.eventScores[eventIdx]) {
        state.eventScores[eventIdx] = {};
      }
      if (state.eventScores[eventIdx][houseId] === points) {
        delete state.eventScores[eventIdx][houseId];
      } else {
        state.eventScores[eventIdx][houseId] = points;
        // Subtle celebratory mini-burst when awarding 1st place (10 pts)
        if (points === 10) {
          const houseObj = HOUSES.find(function(h) { return h.id === houseId; });
          if (houseObj) {
            launchConfetti(new Array(houseObj.hex, '#F8C21C'), 55);
          }
        }
      }
      saveState();
      renderStandings();
      renderEvents();
    }

    function calculateTotals() {
      const totals = {};
      HOUSES.forEach(function(h) {
        let sum = Number(state.initialScores[h.id] || 0);
        Object.values(state.eventScores).forEach(function(ev) {
          if (typeof ev[h.id] === 'number') {
            sum += ev[h.id];
          }
        });
        totals[h.id] = sum;
      });
      return totals;
    }

    function renderStandings() {
      const totals = calculateTotals();
      const sorted = HOUSES.slice().sort(function(a, b) {
        return totals[b.id] - totals[a.id];
      });

      const ranks = {};
      sorted.forEach(function(house, idx) {
        if (idx > 0 && totals[house.id] === totals[sorted[idx - 1].id]) {
          ranks[house.id] = ranks[sorted[idx - 1].id];
        } else {
          ranks[house.id] = idx + 1;
        }
      });

      function getOrdinal(n) {
        if (n === 1) return '1st 🥇';
        if (n === 2) return '2nd 🥈';
        if (n === 3) return '3rd 🥉';
        return n + 'th';
      }

      const container = document.getElementById('standingsContainer');
      container.innerHTML = sorted.map(function(h) {
        const isLeader = ranks[h.id] === 1 && totals[h.id] > 0;
        return '<div class="house-card ' + h.id + (isLeader ? ' leader' : '') + '">' +
          '<div class="card-header">' +
            '<div class="house-title-wrap">' +
              '<span class="color-dot"></span>' +
              '<span class="house-name">' + h.name + '</span>' +
            '</div>' +
            '<span class="rank-badge">' + getOrdinal(ranks[h.id]) + '</span>' +
          '</div>' +
          '<div class="score-display">' +
            '<div class="total-score">' + totals[h.id] + '</div>' +
            '<div class="score-sub">Total Points</div>' +
          '</div>' +
          '<div class="initial-box">' +
            '<label for="init-' + h.id + '">Initial / Bonus Pts:</label>' +
            '<input id="init-' + h.id + '" type="number" value="' + (state.initialScores[h.id] || 0) + '" onchange="updateInitialScore(\'' + h.id + '\', this.value)" />' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderEvents() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('eventsContainer');

      container.innerHTML = EVENTS.map(function(eventName, idx) {
        if (query && eventName.toLowerCase().indexOf(query) === -1) return '';

        const currentScores = state.eventScores[idx] || {};

        const housesHTML = HOUSES.map(function(h) {
          const selected = currentScores[h.id];
          const buttonsHTML = POINT_OPTIONS.map(function(pt) {
            let activeClass = '';
            if (selected === pt) {
              activeClass = pt === 0 ? 'active-zero' : 'active';
            }
            return '<button class="pt-btn ' + activeClass + '" onclick="setEventPoints(' + idx + ', \'' + h.id + '\', ' + pt + ')">' + pt + '</button>';
          }).join('');

          return '<div class="house-score-row ' + h.id + '">' +
            '<span class="house-label">' + h.name + ' (' + h.color + ')</span>' +
            '<div class="point-buttons">' + buttonsHTML + '</div>' +
          '</div>';
        }).join('');

        return '<div class="event-card">' +
          '<div class="event-title">' + eventName + '</div>' +
          '<div class="house-rows">' + housesHTML + '</div>' +
        '</div>';
      }).join('');
    }

    function exportCSV() {
      const totals = calculateTotals();
      let csv = "Billabong High International School Jabalpur - Annual Sports Day Results\n";
      csv += "Event,Freedom (Red),Unity (Blue),Equality (Green),Peace (White)\n";
      csv += "Initial Bonus Points," + (state.initialScores.freedom || 0) + "," + (state.initialScores.unity || 0) + "," + (state.initialScores.equality || 0) + "," + (state.initialScores.peace || 0) + "\n";

      EVENTS.forEach(function(ev, idx) {
        const sc = state.eventScores[idx] || {};
        const f = sc.freedom !== undefined ? sc.freedom : 0;
        const u = sc.unity !== undefined ? sc.unity : 0;
        const e = sc.equality !== undefined ? sc.equality : 0;
        const p = sc.peace !== undefined ? sc.peace : 0;
        csv += '"' + ev + '",' + f + ',' + u + ',' + e + ',' + p + '\n';
      });

      csv += "TOTAL SCORE," + totals.freedom + "," + totals.unity + "," + totals.equality + "," + totals.peace + "\n";

      const blob = new Blob(new Array(csv), { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'BHIS_Jabalpur_Sports_Day_Results.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetAll() {
      if (confirm("Are you sure you want to clear all scores and reset the board?")) {
        state = {
          initialScores: { freedom: 0, unity: 0, equality: 0, peace: 0 },
          eventScores: {}
        };
        saveState();
        renderStandings();
        renderEvents();
      }
    }

    loadLogo();
    loadState();
    renderStandings();
    renderEvents();
  </script>
</body>
</html>
